name: PickupCode

options:
  bundleIdPrefix: local.pickup
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  PickupCode:
    type: application
    platform: iOS
    sources:
      - path: PickupCode
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: PickupCode/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.pickup.code
        MARKETING_VERSION: "0.9.1"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual

schemes:
  PickupCode:
    build:
      targets:
        PickupCode: all
    run:
      config: Release
