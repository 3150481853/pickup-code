name: android-apk

# 安卓版：GitHub 的 ubuntu runner 自带 Android SDK，本地不用装 Gradle/AGP。
# 产物是自签 release APK，装上就能用（和 ios-unsigned.yml 同时跑）。
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -o 'versionName "[0-9.]*"' android/app/build.gradle | head -1 | grep -o '[0-9.]*')
          echo "V=$V" >> "$GITHUB_OUTPUT"
          echo "版本 $V"

      - name: 编译 APK
        run: cd android && gradle assembleRelease --no-daemon --stacktrace

      - name: 改名
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "PickupCode-${{ steps.ver.outputs.V }}-android.apk"
          ls -l PickupCode-*.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PickupCode-${{ steps.ver.outputs.V }}-android-apk
          path: PickupCode-*.apk
          if-no-files-found: error
