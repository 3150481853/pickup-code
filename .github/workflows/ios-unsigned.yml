name: build-unsigned-ipa

# 手动触发，或推到 main 自动跑。产物是「未签名 ipa」，下载后丢给全能签自己签。
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'dist/**'

jobs:
  build:
    name: build (${{ matrix.os }})
    # macos-14 在这个账号上会被解析成 macos-14-arm64-us-default（不支持），
    # 所以一轮里同时试两个镜像；哪个能起跑就用哪个的产物。
    #
    # 以前这里挂了 continue-on-error: true，结果 macos-15 那条腿因为
    # Xcode 16.4 的类型检查超时一直 failure，整轮却显示绿色 —— 等于把真错误藏起来了。
    # 现在不再吞失败：哪条腿红就去看哪条腿。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -o 'MARKETING_VERSION: "[0-9.]*"' ios/project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "版本号 = ${V:-0.0.0}"

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PickupCode.xcodeproj \
            -scheme PickupCode \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -60

      - name: 打包成 ipa
        if: success()
        run: |
          set -e
          V='${{ steps.ver.outputs.v }}'
          rm -rf out && mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PickupCode.app out/Payload/
          cd out
          zip -qry "PickupCode-${V}-unsigned.ipa" Payload
          ls -lh "PickupCode-${V}-unsigned.ipa"
          echo "--- 结构 ---"
          unzip -l "PickupCode-${V}-unsigned.ipa" | head -30

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PickupCode-${{ steps.ver.outputs.v }}-unsigned-ipa-${{ matrix.os }}
          path: out/PickupCode-${{ steps.ver.outputs.v }}-unsigned.ipa
          if-no-files-found: error
