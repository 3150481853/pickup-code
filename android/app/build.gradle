plugins {
    id 'com.android.application'
}

android {
    namespace 'local.pickup'
    compileSdk 34

    defaultConfig {
        applicationId "local.pickup.android"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "0.10.0"
    }

    signingConfigs {
        release {
            // 自用 App：签名密钥就放在仓库里，保证每次升级能覆盖安装
            // （debug 密钥每次 CI 都是新的，装第二次就得先卸载）。
            storeFile file("../keystore.jks")
            storePassword "pickup123"
            keyAlias "pickup"
            keyPassword "pickup123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
